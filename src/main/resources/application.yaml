spring:
  application:
    name: file-converter
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fileconverter}
    username: ${DB_USER:dbadmin}
    password: ${DB_PASSWORD:dbadmin}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.example.file_converter.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.file_converter.event.FileUploadedEvent
minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket:
      input: ${MINIO_BUCKET_INPUT:uploaded}
      output: ${MINIO_BUCKET_OUTPUT:converted}