databaseChangeLog:
  - changeSet:
      id: 01-create-inbox
      author: ALVKRAVCHENKO
      changes:
        - createTable:
            tableName: inbox
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
  - changeSet:
      id: 02-create-outbox
      author: ALVKRAVCHENKO
      changes:
        - createTable:
            tableName: outbox
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: topic
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: true